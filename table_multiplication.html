<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Maths Robots - Studio de Multiplication</title>
    
    <!-- Paramètres PWA pour l'installation en plein écran sur smartphone -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Maths Robots">
    <meta name="theme-color" content="#3742fa">

    <link rel="manifest" href="./manifest.json">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Sniglet:wght@800&display=swap');

        :root {
            --app-gold: #ffd32a;
            --app-red: #ff3f34;
            --app-blue: #00d2d3;
            --app-dark: #1e272e;
            --bar-bg: #2f3542;
        }

        body {
            font-family: 'Sniglet', 'Segoe UI', cursive, sans-serif;
            background: linear-gradient(135deg, #3742fa 0%, #2f3542 100%);
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            user-select: none;
            min-height: 100vh;
            box-sizing: border-box;
        }

        h1 {
            font-family: 'Fredoka One', cursive;
            color: var(--app-gold);
            margin: 0 0 8px 0;
            text-shadow: 3px 3px 0px var(--app-dark), -2px -2px 0px var(--app-dark);
            font-size: 2rem;
            text-align: center;
            letter-spacing: 2px;
        }

        #game-container {
            width: 100%;
            max-width: 800px;
            background: #fff;
            border: 5px solid var(--app-dark);
            border-radius: 25px;
            box-shadow: 0 12px 0px rgba(0,0,0,0.25);
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-sizing: border-box;
            background-image: radial-gradient(#d2dae2 15%, transparent 16%);
            background-size: 18px 18px;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--app-dark);
            padding: 10px 15px;
            border-radius: 15px;
            color: white;
            font-size: 1rem;
            box-shadow: inset 0 -4px 0 rgba(0,0,0,0.4);
            flex-wrap: wrap;
            gap: 8px;
        }

        .badge {
            background: var(--app-gold);
            color: var(--app-dark);
            padding: 4px 10px;
            border-radius: 12px;
            font-family: 'Fredoka One', cursive;
        }

        .action-toggle-btn {
            background: #ffa502;
            color: var(--app-dark);
            border: 2px solid white;
            padding: 4px 10px;
            border-radius: 10px;
            cursor: pointer;
            font-family: 'Fredoka One', cursive;
            font-size: 0.85rem;
            transition: transform 0.1s;
        }

        .action-toggle-btn:active {
            transform: scale(0.95);
        }

        .battery-container {
            background: var(--bar-bg);
            border: 3px solid var(--app-dark);
            border-radius: 14px;
            padding: 6px 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 5px 0 var(--app-dark);
            transition: all 0.3s ease;
        }

        .battery-container.ready-l1 {
            border-color: #2ed573;
            box-shadow: 0 0 10px #2ed573, 0 5px 0 var(--app-dark);
        }

        .battery-container.ready-l2 {
            border-color: var(--app-gold);
            box-shadow: 0 0 15px var(--app-gold), 0 5px 0 var(--app-dark);
        }

        .battery-label {
            color: white;
            font-family: 'Fredoka One', cursive;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .battery-slots {
            display: flex;
            gap: 8px;
        }

        .energy-slot {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
            border: 2px dashed rgba(255, 255, 255, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        .energy-slot.filled {
            background: var(--app-gold);
            border: 2px solid white;
            box-shadow: 0 0 8px var(--app-gold);
            transform: scale(1.15);
        }

        .board-container {
            position: relative;
            width: 290px;
            height: 290px;
            margin: 0 auto;
            background: #fff200;
            border-radius: 50%;
            border: 8px solid #3742fa;
            box-shadow: 0 8px 0 #d2dae2, inset 0 0 15px rgba(0,0,0,0.15);
        }

        .ring-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            background: rgba(255, 255, 255, 0.95);
            border: 3px solid var(--app-dark);
            padding: 10px;
            border-radius: 50%;
            width: 95px;
            height: 95px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 0 rgba(0,0,0,0.1);
        }

        .ring-icon {
            font-size: 1.8rem;
            line-height: 1;
        }

        .ring-text {
            font-size: 0.7rem;
            font-weight: bold;
            color: var(--app-dark);
            margin-top: 2px;
            font-family: 'Fredoka One', cursive;
        }

        .case {
            position: absolute;
            width: 46px;
            height: 46px;
            background: #ffffff;
            border: 3px solid var(--app-dark);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transform: translate(-50%, -50%);
            transition: transform 0.15s ease, background 0.15s ease;
            box-shadow: 0 4px 0 var(--app-dark);
        }

        .case-number {
            font-family: 'Fredoka One', cursive;
            font-size: 1.3rem;
            color: var(--app-dark);
            z-index: 1;
            pointer-events: none;
        }

        .case:active {
            transform: translate(-50%, -47%) scale(0.95);
            box-shadow: 0 1px 0 var(--app-dark);
        }

        .pawn-badge-container {
            position: absolute;
            top: -16px;
            display: flex;
            gap: 2px;
            z-index: 2;
            pointer-events: none;
        }

        .pawn-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 2px solid var(--app-dark);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            box-shadow: 0 3px 0 rgba(0,0,0,0.3);
            background: white;
            transition: transform 0.2s;
        }

        .pawn-avatar.alpha { background: var(--app-red); }
        .pawn-avatar.beta { background: var(--app-blue); }

        .pawn-avatar.active-blink {
            animation: robotBounce 0.6s infinite alternate;
        }

        @keyframes robotBounce {
            0% { transform: scale(1) translateY(0); }
            100% { transform: scale(1.35) translateY(-4px); filter: brightness(1.2); }
        }

        #message-box {
            text-align: center;
            background: #7bed9f;
            color: var(--app-dark);
            padding: 10px 12px;
            border-radius: 14px;
            font-weight: bold;
            font-size: 0.95rem;
            border: 3px solid var(--app-dark);
            box-shadow: 0 4px 0 var(--app-dark);
            min-height: 24px;
        }

        .hand-section {
            background: #ffeaa7;
            padding: 12px;
            border-radius: 16px;
            border: 3px solid var(--app-dark);
        }

        .hand-title {
            font-size: 1rem;
            margin-bottom: 8px;
            color: var(--app-dark);
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .cards-container {
            display: flex;
            gap: 8px;
            justify-content: center;
            flex-wrap: wrap;
            padding: 4px 0;
            min-height: 75px;
            align-items: center;
        }

        .card {
            width: 50px;
            height: 72px;
            background: white;
            border: 3px solid var(--app-dark);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 0 var(--app-dark);
            transition: all 0.15s ease;
            position: relative;
        }

        .card:hover {
            transform: translateY(-5px) rotate(-2deg);
            background: var(--app-gold);
        }

        .card.selected-card {
            background: var(--app-red);
            color: white;
            transform: translateY(-8px) scale(1.08);
            border-color: var(--app-dark);
            box-shadow: 0 6px 0 var(--app-dark);
        }

        .card.hint-playable {
            border-color: #2ed573;
            box-shadow: 0 0 12px #2ed573, 0 4px 0 var(--app-dark);
            animation: hintPulse 1s infinite alternate;
        }

        @keyframes hintPulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.06); }
        }

        .card-number {
            font-family: 'Fredoka One', cursive;
            font-size: 1.35rem;
        }

        .controls {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        button.action-btn {
            flex: 1;
            min-width: 120px;
            background: var(--app-red);
            color: white;
            border: 3px solid var(--app-dark);
            padding: 10px;
            font-family: 'Fredoka One', cursive;
            font-size: 0.9rem;
            border-radius: 14px;
            cursor: pointer;
            box-shadow: 0 4px 0 var(--app-dark);
            transition: all 0.1s;
        }

        button.action-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }

        button.action-btn:active:not(:disabled) {
            transform: translateY(3px);
            box-shadow: 0 1px 0 var(--app-dark);
        }

        button.power-btn { background: #2ed573; color: var(--app-dark); }
        button.secondary-btn { background: #3742fa; }
    </style>
</head>
<body>

    <h1>🤖 MATHS ROBOTS ⚡</h1>

    <div id="game-container">
        <div class="status-bar">
            <div>🎴 Cartes : <span id="player-cards-count" class="badge">8</span></div>
            <div>⭐ Score : <span id="score-count" class="badge">0</span></div>
            <div style="display: flex; gap: 5px;">
                <button class="action-toggle-btn" id="help-btn" onclick="toggleHelp()">💡 Aide : OFF</button>
                <button class="action-toggle-btn" id="music-btn" onclick="initAudio(); toggleMusic();" style="background:#ff9ff3;">🎵 Audio : OFF</button>
            </div>
        </div>

        <div class="battery-container" id="battery-container">
            <div class="battery-label" id="battery-label">🔋 TOUR : ALPHA</div>
            <div class="battery-slots" id="battery-slots">
                <div class="energy-slot">⚡</div>
                <div class="energy-slot">⚡</div>
                <div class="energy-slot">⚡</div>
                <div class="energy-slot">⚡</div>
                <div class="energy-slot">⚡</div>
            </div>
        </div>

        <div id="message-box">Choisis une carte en bas, puis clique sur la case cible !</div>

        <div class="board-container" id="board">
            <div class="ring-center">
                <div class="ring-icon">💻</div>
                <div class="ring-text" id="center-turn-text">STUDIO</div>
            </div>
        </div>

        <div class="hand-section">
            <div class="hand-title">🃏 Tes cartes en main :</div>
            <div class="cards-container" id="player-hand"></div>
        </div>

        <div class="controls">
            <button class="action-btn power-btn" id="power-btn" onclick="usePower()" disabled>⚡ Super Mode</button>
            <button class="action-btn secondary-btn" onclick="drawAndRemix()">🃏 Piocher & Remuer</button>
            <button class="action-btn" onclick="resetGame()">🔄 Recommencer</button>
        </div>
    </div>

    <script>
        // Enregistrement automatique d'un Service Worker via un Blob (permet l'installation PWA en fichier unique sur GitHub Pages)
        if ('serviceWorker' in navigator) {
            const swCode = `self.addEventListener('fetch', (event) => { event.respondWith(fetch(event.request).catch(() => caches.match(event.request))); });`;
            const swBlob = new Blob([swCode], { type: 'text/javascript' });
            const swUrl = URL.createObjectURL(swBlob);
            navigator.serviceWorker.register(swUrl).catch((err) => console.log('SW error', err));
        }

        let pawnAlpha = 2;
        let pawnBeta = 5;
        let activeTurn = 'alpha';
        let score = 0;
        let energyLevel = 0; 
        const MAX_ENERGY = 5;
        let powerMode = 0; 
        let step1Alpha = null;
        let helpMode = false;

        let playerCards = [];
        let selectedCardIndex = null;

        const boardElement = document.getElementById('board');
        let audioCtx = null;

        let musicPlaying = false;
        let musicInterval = null;
        const zenNotes = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25];

        function toggleMusic() {
            initAudio();
            musicPlaying = !musicPlaying;
            const btn = document.getElementById('music-btn');

            if (musicPlaying) {
                btn.innerText = "🎵 Audio : ON";
                btn.style.background = "#2ed573";
                startAmbientMusic();
            } else {
                btn.innerText = "🎵 Audio : OFF";
                btn.style.background = "#ff9ff3";
                stopAmbientMusic();
            }
        }

        function toggleHelp() {
            helpMode = !helpMode;
            const btn = document.getElementById('help-btn');
            if (helpMode) {
                btn.innerText = "💡 Aide : ON";
                btn.style.background = "#2ed573";
                setMessage("💡 Mode Aide activé : regarde les cartes qui scintillent !");
            } else {
                btn.innerText = "💡 Aide : OFF";
                btn.style.background = "#ffa502";
                setMessage("💡 Mode Aide désactivé.");
            }
            updateUI();
        }

        function startAmbientMusic() {
            if (musicInterval) clearInterval(musicInterval);
            
            musicInterval = setInterval(() => {
                if (!musicPlaying || !audioCtx) return;
                try {
                    const now = audioCtx.currentTime;
                    const randNote = zenNotes[Math.floor(Math.random() * zenNotes.length)];
                    
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(randNote, now);
                    
                    gain.gain.setValueAtTime(0.001, now);
                    gain.gain.linearRampToValueAtTime(0.04, now + 0.8);
                    gain.gain.exponentialRampToValueAtTime(0.0001, now + 2.4);
                    
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    
                    osc.start(now);
                    osc.stop(now + 2.5);
                } catch(e){}
            }, 2500);
        }

        function stopAmbientMusic() {
            if (musicInterval) {
                clearInterval(musicInterval);
                musicInterval = null;
            }
        }

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playSound(type) {
            try {
                initAudio();
                const now = audioCtx.currentTime;

                if (type === 'select') {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(523.25, now);
                    osc.frequency.exponentialRampToValueAtTime(1046.50, now + 0.08);
                    gain.gain.setValueAtTime(0.12, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.08);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now);
                    osc.stop(now + 0.08);

                } else if (type === 'success') {
                    const notes = [523.25, 659.25, 783.99, 1046.50];
                    notes.forEach((freq, idx) => {
                        const osc = audioCtx.createOscillator();
                        const gain = audioCtx.createGain();
                        osc.type = 'triangle';
                        osc.frequency.setValueAtTime(freq, now + (idx * 0.06));
                        gain.gain.setValueAtTime(0.15, now + (idx * 0.06));
                        gain.gain.exponentialRampToValueAtTime(0.01, now + (idx * 0.06) + 0.15);
                        osc.connect(gain);
                        gain.connect(audioCtx.destination);
                        osc.start(now + (idx * 0.06));
                        osc.stop(now + (idx * 0.06) + 0.15);
                    });

                    const bass = audioCtx.createOscillator();
                    const bassGain = audioCtx.createGain();
                    bass.type = 'sine';
                    bass.frequency.setValueAtTime(150, now + 0.2);
                    bass.frequency.exponentialRampToValueAtTime(40, now + 0.45);
                    bassGain.gain.setValueAtTime(0.2, now + 0.2);
                    bassGain.gain.linearRampToValueAtTime(0.01, now + 0.45);
                    bass.connect(bassGain);
                    bassGain.connect(audioCtx.destination);
                    bass.start(now + 0.2);
                    bass.stop(now + 0.45);

                } else if (type === 'fail') {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(300, now);
                    osc.frequency.exponentialRampToValueAtTime(80, now + 0.35);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.35);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now);
                    osc.stop(now + 0.35);

                } else if (type === 'power') {
                    const freqs = [440, 554.37, 659.25, 880, 1046.50];
                    freqs.forEach((f, i) => {
                        const osc = audioCtx.createOscillator();
                        const gain = audioCtx.createGain();
                        osc.type = 'square';
                        osc.frequency.setValueAtTime(f, now + (i * 0.07));
                        gain.gain.setValueAtTime(0.1, now + (i * 0.07));
                        gain.gain.linearRampToValueAtTime(0.01, now + (i * 0.07) + 0.18);
                        osc.connect(gain);
                        gain.connect(audioCtx.destination);
                        osc.start(now + (i * 0.07));
                        osc.stop(now + (i * 0.07) + 0.18);
                    });
                }
            } catch(e){}
        }

        for (let i = 0; i <= 10; i++) {
            const angle = (i / 11) * 2 * Math.PI - Math.PI / 2;
            const radius = 110; 
            const x = 145 + radius * Math.cos(angle);
            const y = 145 + radius * Math.sin(angle);

            const caseEl = document.createElement('div');
            caseEl.className = 'case';
            caseEl.style.left = `${x}px`;
            caseEl.style.top = `${y}px`;
            caseEl.onclick = () => onCaseClick(i);
            caseEl.id = `case-${i}`;

            const numEl = document.createElement('span');
            numEl.className = 'case-number';
            numEl.innerText = i;
            caseEl.appendChild(numEl);

            const badgeContainer = document.createElement('div');
            badgeContainer.className = 'pawn-badge-container';
            badgeContainer.id = `badges-${i}`;
            caseEl.appendChild(badgeContainer);

            boardElement.appendChild(caseEl);
        }

        function resetGame() {
            pawnAlpha = Math.floor(Math.random() * 4) + 1;
            do {
                pawnBeta = Math.floor(Math.random() * 5) + 5;
            } while (pawnBeta === pawnAlpha);

            activeTurn = 'alpha';
            score = 0;
            energyLevel = 0;
            powerMode = 0;
            step1Alpha = null;
            playerCards = [];

            for(let i = 0; i < 8; i++) {
                playerCards.push(getRandomCard());
            }

            selectedCardIndex = null;
            updateUI();
            setMessage("Vide tes 8 cartes pour gagner ! Tour du Robot Alpha 🤖.");
        }

        function getRandomCard() {
            const a = Math.floor(Math.random() * 8) + 2; 
            const b = Math.floor(Math.random() * 10) + 1; 
            return a * b;
        }

        function isCardPlayable(cardVal) {
            for (let tAlpha = 0; tAlpha <= 10; tAlpha++) {
                for (let tBeta = 0; tBeta <= 10; tBeta++) {
                    if (tAlpha * tBeta === cardVal) {
                        if (powerMode > 0 || powerMode === 2 || powerMode === 3) {
                            return true;
                        }
                        if (activeTurn === 'alpha' && tBeta === pawnBeta) return true;
                        if (activeTurn === 'beta' && tAlpha === pawnAlpha) return true;
                    }
                }
            }
            return false;
        }

        function selectCard(index) {
            initAudio();
            selectedCardIndex = index;
            playSound('select');
            updateUI();
            const cardVal = playerCards[index];
            setMessage(`Carte ${cardVal} choisie. Clique sur la case cible !`);
        }

        function onCaseClick(targetValue) {
            initAudio();
            if (selectedCardIndex === null) {
                setMessage("⚠️ Choisis d'abord une carte en bas !");
                return;
            }

            const cardVal = playerCards[selectedCardIndex];
            let isValid = false;

            if (powerMode === 2) {
                step1Alpha = targetValue;
                pawnAlpha = targetValue;
                powerMode = 3; 
                playSound('select');
                setMessage("🔥 Double Mode : Premier robot placé ! Clique sur la case du second robot.");
                updateUI();
                return;
            } else if (powerMode === 3) {
                let finalAlpha = step1Alpha;
                let finalBeta = targetValue;

                if (finalAlpha * finalBeta === cardVal || targetValue * pawnAlpha === cardVal || step1Alpha * targetValue === cardVal) {
                    if (finalAlpha * finalBeta === cardVal) {
                        pawnAlpha = finalAlpha;
                        pawnBeta = finalBeta;
                    } else if (targetValue * pawnAlpha === cardVal) {
                        pawnBeta = targetValue;
                    } else {
                        pawnAlpha = step1Alpha;
                        pawnBeta = targetValue;
                    }
                    isValid = true;
                    powerMode = 0;
                }
                
                if (!isValid) {
                    powerMode = 2;
                    step1Alpha = null;
                    playSound('fail');
                    setMessage("Oups ! Cette combinaison ne fait pas " + cardVal + ". Réessaie le double mode.");
                    updateUI();
                    return;
                }
            } else if (powerMode === 1) {
                if (targetValue * pawnBeta === cardVal || pawnAlpha * targetValue === cardVal) {
                    if (targetValue * pawnBeta === cardVal) pawnAlpha = targetValue;
                    else pawnBeta = targetValue;
                    isValid = true;
                    powerMode = 0;
                }
            } else {
                if (activeTurn === 'alpha' && targetValue * pawnBeta === cardVal) {
                    pawnAlpha = targetValue;
                    isValid = true;
                } else if (activeTurn === 'beta' && pawnAlpha * targetValue === cardVal) {
                    pawnBeta = targetValue;
                    isValid = true;
                }
            }

            if (isValid) {
                playSound('success');
                playerCards.splice(selectedCardIndex, 1);
                selectedCardIndex = null;
                
                score += 10;
                energyLevel = Math.min(MAX_ENERGY, energyLevel + 1);
                if (powerMode === 0) {
                    activeTurn = activeTurn === 'alpha' ? 'beta' : 'alpha';
                }

                updateUI();

                if (playerCards.length === 0) {
                    setMessage("🏆 VICTOIRE ! Tu as programmé tous tes calculs !");
                    alert("🎉 Incroyable ! Tu es un maître du calcul mental !");
                    resetGame();
                } else {
                    setMessage(`Super coup ! Il reste ${playerCards.length} cartes.`);
                }
            } else {
                playSound('fail');
                setMessage("Oups ! Ce calcul ne correspond pas avec la carte sélectionnée. Réessaie !");
            }
        }

        function usePower() {
            initAudio();
            if (energyLevel < 3) return;
            
            playSound('power');
            
            if (energyLevel >= 5) {
                energyLevel = 0;
                powerMode = 2;
                step1Alpha = null;
                setMessage("🔥 DOUBLE MODE ACTIF ! Clique sur la case du premier robot.");
            } else if (energyLevel >= 3) {
                energyLevel -= 3;
                powerMode = 1;
                setMessage("⚡ SUPER MODE ACTIF ! Déplace le robot de ton choix librement !");
            }
            updateUI();
        }

        function drawAndRemix() {
            initAudio();
            playSound('fail');
            
            playerCards.push(getRandomCard());

            const targetCard = playerCards[Math.floor(Math.random() * playerCards.length)];
            let validPairs = [];
            for (let a = 1; a <= 10; a++) {
                if (targetCard % a === 0) {
                    let b = targetCard / a;
                    if (b <= 10) validPairs.push({ a, b });
                }
            }

            if (validPairs.length > 0) {
                const pair = validPairs[Math.floor(Math.random() * validPairs.length)];
                pawnAlpha = pair.a;
                pawnBeta = pair.b;
            }

            activeTurn = activeTurn === 'alpha' ? 'beta' : 'alpha';
            selectedCardIndex = null;
            updateUI();
            setMessage("✨ Une carte piochée et les positions ajustées pour être jouables !");
        }

        function updateUI() {
            document.getElementById('player-cards-count').innerText = playerCards.length;
            document.getElementById('score-count').innerText = score;

            const batteryContainer = document.getElementById('battery-container');
            const slots = document.querySelectorAll('.energy-slot');
            
            slots.forEach((slot, idx) => {
                if (idx < energyLevel) {
                    slot.classList.add('filled');
                } else {
                    slot.classList.remove('filled');
                }
            });

            batteryContainer.className = "battery-container";
            if (energyLevel >= 5) batteryContainer.classList.add('ready-l2');
            else if (energyLevel >= 3) batteryContainer.classList.add('ready-l1');

            document.getElementById('power-btn').disabled = (energyLevel < 3);
            if (energyLevel >= 5) {
                document.getElementById('power-btn').innerText = "🔥 Double Mode (Niv 2)";
            } else {
                document.getElementById('power-btn').innerText = "⚡ Super Mode (Niv 1)";
            }

            document.getElementById('battery-label').innerText = powerMode > 0 ? "⚡ MODE LIBRE" : `🤖 TOUR : ${activeTurn.toUpperCase()}`;
            document.getElementById('center-turn-text').innerText = powerMode > 0 ? "⚡ LIBRE" : `TOUR ${activeTrustText = activeTurn.toUpperCase()}`; // Corrigé proprement

            for(let i=0; i<=10; i++) {
                const container = document.getElementById(`badges-${i}`);
                container.innerHTML = '';

                if (i === pawnAlpha) {
                    const avatarA = document.createElement('div');
                    avatarA.className = `pawn-avatar alpha ${(activeTurn === 'alpha' || powerMode > 0) ? 'active-blink' : ''}`;
                    avatarA.innerText = '🤖';
                    container.appendChild(avatarA);
                }
                if (i === pawnBeta) {
                    const avatarB = document.createElement('div');
                    avatarB.className = `pawn-avatar beta ${(activeTurn === 'beta' || powerMode > 0) ? 'active-blink' : ''}`;
                    avatarB.innerText = '👾';
                    container.appendChild(avatarB);
                }
            }

            const handContainer = document.getElementById('player-hand');
            handContainer.innerHTML = '';
            playerCards.forEach((cardVal, idx) => {
                const cardEl = document.createElement('div');
                
                let isPlayable = isCardPlayable(cardVal);
                let hintClass = (helpMode && isPlayable) ? 'hint-playable' : '';

                cardEl.className = `card ${selectedCardIndex === idx ? 'selected-card' : ''} ${hintClass}`;
                cardEl.innerHTML = `<div class="card-number">${cardVal}</div>`;
                cardEl.onclick = () => selectCard(idx);
                handContainer.appendChild(cardEl);
            });
        }

        function setMessage(text) {
            document.getElementById('message-box').innerText = text;
        }

        resetGame();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chrono Robots - Calcul Mental Express</title>

    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Chrono Robots">
    <meta name="theme-color" content="#3742fa">

    <link rel="manifest" href="./manifest.json">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Sniglet:wght@800&display=swap');

        :root {
            --app-gold: #ffd32a;
            --app-red: #ff3f34;
            --app-green: #2ed573;
            --app-blue: #3742fa;
            --app-dark: #1e272e;
            --bar-bg: #2f3542;
        }

        body {
            font-family: 'Sniglet', 'Segoe UI', cursive, sans-serif;
            background: linear-gradient(135deg, #3742fa 0%, #2f3542 100%);
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            user-select: none;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .nav-header {
            width: 100%;
            max-width: 440px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .switch-game-link {
            background: rgba(255, 255, 255, 0.95);
            color: var(--app-dark);
            text-decoration: none;
            font-family: 'Fredoka One', cursive;
            font-size: 0.8rem;
            padding: 5px 10px;
            border-radius: 10px;
            border: 2px solid var(--app-dark);
            box-shadow: 0 2px 0 var(--app-dark);

        }

        .switch-game-link:active {
            transform: translateY(2px);
            box-shadow: none;
        }

        h1 {
            font-family: 'Fredoka One', cursive;
            color: var(--app-gold);
            margin: 0 0 8px 0;
            text-shadow: 3px 3px 0px var(--app-dark), -2px -2px 0px var(--app-dark);
            font-size: 1.8rem;
            text-align: center;
            letter-spacing: 2px;
        }

        #game-container {
            width: 100%;
            max-width: 440px;
            background: #fff;
            border: 5px solid var(--app-dark);
            border-radius: 25px;
            box-shadow: 0 12px 0px rgba(0,0,0,0.25);
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-sizing: border-box;
            background-image: radial-gradient(#d2dae2 15%, transparent 16%);
            background-size: 18px 18px;
        }

        #game-screen {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--app-dark);
            padding: 8px 14px;
            border-radius: 14px;
            color: white;
            font-size: 0.95rem;
            box-shadow: inset 0 -4px 0 rgba(0,0,0,0.4);

        .badge {
            background: var(--app-gold);
            color: var(--app-dark);
            padding: 3px 9px;
            border-radius: 10px;
            font-family: 'Fredoka One', cursive;
        }

        /* Aire de jeu : Roue centrale + Jauge de temps à droite */
        .play-area {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            position: relative;
        }

        .board-container {
            position: relative;
            width: 290px;
            height: 290px;
            margin: 0;
            background: #fff200;
            border-radius: 50%;
            border: 8px solid var(--app-blue);
            box-shadow: 0 8px 0 #d2dae2, inset 0 0 15px rgba(0,0,0,0.15);
            flex-shrink: 0;
        }

        .ring-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            background: rgba(255, 255, 255, 0.97);
            border: 4px solid var(--app-dark);
            padding: 6px;
            border-radius: 50%;
            width: 124px;
            height: 124px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 0 rgba(0,0,0,0.15);
            z-index: 5;
        }

        .target-label {
            font-size: 0.65rem;
            font-weight: bold;
            color: #718093;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .target-number {
            font-family: 'Fredoka One', cursive;
            font-size: 1.7rem;
            color: var(--app-red);
            line-height: 1.15;
            text-align: center;
            word-break: break-word;
        }

        .case {
            position: absolute;
            width: 48px;
            height: 48px;
            background: #ffffff;
            border: 3px solid var(--app-dark);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transform: translate(-50%, -50%);
            transition: transform 0.1s ease, background 0.15s ease;
            box-shadow: 0 4px 0 var(--app-dark);
        }

        .case-number {
            font-family: 'Fredoka One', cursive;
            font-size: 1.25rem;
            color: var(--app-dark);
            pointer-events: none;
        }

        .case:active {
            transform: translate(-50%, -47%) scale(0.92);
            box-shadow: 0 1px 0 var(--app-dark);
            background: var(--app-gold);
        }

        /* Jauge de temps verticale à droite (sans texte) */
        .timer-bar-container.vertical {
            width: 20px;
            height: 290px;
            background: #dfe4ea;
            border: 3px solid var(--app-dark);
            border-radius: 12px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 4px 0 var(--app-dark);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            flex-shrink: 0;
        }

        .timer-bar-container.vertical .timer-fill {
            width: 100%;
            height: 100%;
            background: var(--app-green);
            transition: height 0.2s linear, background-color 0.3s;
        }

        #feedback-box {
            text-align: center;
            background: #7bed9f;
            color: var(--app-dark);
            padding: 8px 12px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 0.95rem;
            border: 3px solid var(--app-dark);
            box-shadow: 0 3px 0 var(--app-dark);
            min-height: 22px;
        }

        .controls-row {
            display: flex;
            gap: 8px;
        }

        button.action-btn {
            flex: 1;
            background: #ffa502;
            color: var(--app-dark);
            border: 3px solid var(--app-dark);
            padding: 9px;
            font-family: 'Fredoka One', cursive;
            font-size: 0.9rem;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 0 var(--app-dark);
        }

        button.action-btn:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 var(--app-dark);
        }

        #gameover-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            padding: 10px 0;
            text-align: center;
        }

        .stats-box {
            background: #f1f2f6;
            border: 3px solid var(--app-dark);
            border-radius: 15px;
            padding: 15px;
            width: 100%;
            box-sizing: border-box;
            font-size: 1.05rem;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .start-btn {
            background: var(--app-red);
            color: white;
            border: 4px solid var(--app-dark);
            border-radius: 16px;
            padding: 14px;
            font-family: 'Fredoka One', cursive;
            font-size: 1.3rem;
            cursor: pointer;
            box-shadow: 0 6px 0 var(--app-dark);
            text-align: center;
            width: 100%;
            box-sizing: border-box;
            transition: transform 0.1s;
        }

        .start-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 var(--app-dark);
        }
    </style>
</head>
<body>

<div class="nav-header">
    <span style="font-size:0.85rem; color:#fff; font-weight:bold;">🤖 CE2 / CM1 / CM2</span>
    <a href="./complements_10_20.html" class="switch-game-link">🎯 Compléments CP/CE1 ➜</a>
</div>

<h1>🤖 CHRONO ROBOTS ⚡</h1>

<div id="game-container">

    <!-- ÉCRAN DE JEU (DIRECTEMENT ACTIF) -->
    <div id="game-screen">
        <div class="status-bar">
            <div>✅ Réussite : <span id="score-success" class="badge">0</span></div>
            <div>❌ Erreurs : <span id="score-fail" class="badge" style="background:#ff3f34; color:white;">0</span></div>
        </div>

        <!-- ZONE DE JEU AVEC LA ROUE ET LA JAUGE VERTICALE ÉPURÉE À DROITE -->
        <div class="play-area">
            <div class="board-container" id="board">
                <div class="ring-center">
                    <div class="target-label" id="target-label">CALCUL</div>
                    <div class="target-number" id="target-num">--</div>
                </div>
            </div>

            <div class="timer-bar-container vertical">
                <div class="timer-fill" id="timer-fill"></div>
            </div>
        </div>

        <!-- CONSIGNE & FEEDBACK SOUS LA ROUE -->
        <div id="feedback-box">Trouve le bon résultat sur le cercle !</div>

        <div class="controls-row">
            <button class="action-btn" onclick="toggleMusic();" id="music-btn" style="background:#ff9ff3;">🎵 Audio : OFF</button>
            <button class="action-btn" onclick="restartGame()">🔄 Recommencer</button>
        </div>
    </div>

    <!-- ÉCRAN DE FIN -->
    <div id="gameover-screen">
        <div style="font-family: 'Fredoka One', cursive; font-size: 1.6rem; color: var(--app-red);">⏱️ TEMPS ÉCOULÉ !</div>

        <div class="stats-box">
            <div>✅ Calculs réussis : <strong id="end-success" style="color:var(--app-green); font-size:1.3rem;">0</strong></div>
            <div>❌ Calculs ratés : <strong id="end-fail" style="color:var(--app-red); font-size:1.3rem;">0</strong></div>
            <div style="margin-top:4px;">🎯 Précision : <strong id="end-precision" style="color:var(--app-blue); font-size:1.2rem;">0%</strong></div>
        </div>

        <button class="start-btn" onclick="restartGame()">🚀 REJOUER</button>
    </div>

</div>

<script>
    // Configuration du tempo et du temps (dynamique tendue)
    const INITIAL_TIME = 35; // 35 secondes au départ
    const TIME_BONUS = 3;    // +3s par bonne réponse
    const TIME_PENALTY = 5;  // -5s par erreur

    let timeLeft = INITIAL_TIME;
    let timerInterval = null;
    let nextQuestionTimeout = null;
    let isTransitioning = false; // Empêche les double-clics pendant la transition

    let targetAnswer = null;

    let successCount = 0;
    let failCount = 0;
    let questionCounter = 0; // Compteur pour l'alternance rythmée
    let lastTableUsed = null; // Évite d'interroger la même table deux fois de suite

    // Decks dynamiques assurant une couverture complète de toutes les tables sans angle mort
    let easyDeck = [];
    let hardDeck = [];

    const boardElement = document.getElementById('board');
    const targetLabelElement = document.getElementById('target-label');
    const targetNumElement = document.getElementById('target-num');

    let audioCtx = null;
    let musicPlaying = false;
    let musicInterval = null;
    const zenNotes = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25];

    // --- BANQUE DE QUESTIONS STRATIFIÉES SELON LA DIFFICULTÉ COGNITIVE ---

    // 1. Panier Difficile : la "zone rouge" (les tables 6, 7, 8, 9 et leurs pièges standards)
    const BASE_HARD_PAIRS = [
        [7, 8], [8, 7], // 56 (le n°1 des erreurs)
        [6, 8], [8, 6], // 48
        [6, 7], [7, 6], // 42
        [7, 9], [9, 7], // 63
        [8, 9], [9, 8], // 72
        [6, 9], [9, 6], // 54
        [8, 8],         // 64
        [7, 7],         // 49
        [4, 7], [7, 4], // 28
        [4, 8], [8, 4], // 32
        [9, 9]          // 81
    ];

    // Pièges fréquents dans la zone 40-75 (interférences classiques)
    const CRITICAL_PRODUCTS = [28, 32, 36, 42, 45, 48, 49, 54, 56, 63, 64, 72, 81];

    // 2. Panier Respiration & Échauffement : couverture équilibrée des tables 2, 3, 4, 5 et carrés
    const BASE_EASY_PAIRS = [
        // Table de 2
        [2, 3], [2, 4], [2, 6], [2, 7], [2, 8], [2, 9],
        // Table de 3
        [3, 3], [3, 4], [3, 5], [3, 6], [3, 7], [3, 8], [3, 9],
        // Table de 4
        [4, 3], [4, 4], [4, 5], [4, 6], [4, 9],
        // Table de 5
        [5, 3], [5, 4], [5, 5], [5, 6], [5, 7], [5, 8], [5, 9],
        // Table de 9 modérée & carré de 6
        [9, 2], [9, 3], [9, 4], [9, 5],
        [6, 6]
    ];

    /**
     * Algorithme Fisher-Yates (Knuth shuffle)
     */
    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    /**
     * Initialise ou renouvelle un deck équilibré
     */
    function refillDeck(deckType) {
        if (deckType === 'hard') {
            return shuffleArray([...BASE_HARD_PAIRS]);
        } else {
            return shuffleArray([...BASE_EASY_PAIRS]);
        }
    }

    /**
     * Tire une paire depuis un deck sans répétition immédiate de la même table
     */
    function drawFromDeck(isHard) {
        let deck = isHard ? hardDeck : easyDeck;
        if (!deck || deck.length === 0) {
            deck = refillDeck(isHard ? 'hard' : 'easy');
            if (isHard) hardDeck = deck; else easyDeck = deck;
        }

        // Recherche d'une paire qui ne répète pas la table précédente si possible
        let selectedIndex = 0;
        if (lastTableUsed !== null && deck.length > 1) {
            for (let i = 0; i < deck.length; i++) {
                if (deck[i][0] !== lastTableUsed && deck[i][1] !== lastTableUsed) {
                    selectedIndex = i;
                    break;
                }
            }
        }

        const chosenPair = deck.splice(selectedIndex, 1)[0];
        lastTableUsed = chosenPair[0];
        return chosenPair;
    }

    /**
     * Génère un problème selon une alternance rythmée :
     * Tour pair : Respiration / Échauffement (Tables 2, 3, 4, 5, 9)
     * Tour impair : Challenge (Zone rouge critique : 6, 7, 8, 9)
     */
    function generateQuestion() {
        const isHard = (questionCounter % 2 === 1);
        const chosenPair = drawFromDeck(isHard);

        const factorA = chosenPair[0];
        const factorB = chosenPair[1];
        const product = factorA * factorB;

        // Choix du format de problème :
        // 0: Produit direct (ex: "7 × 8" -> chercher 56)
        // 1: Facteur gauche manquant (ex: "? × 8 = 56" -> chercher 7)
        // 2: Facteur droit manquant (ex: "7 × ? = 56" -> chercher 8)
        const type = Math.floor(Math.random() * 3);

        let questionText = '';
        let answer = null;
        let distractors = [];

        if (type === 0) {
            // Recherche du produit direct
            targetLabelElement.textContent = isHard ? "🔥 DÉFI" : "CALCUL";
            questionText = `${factorA} × ${factorB}`;
            answer = product;

            const trapCandidates = new Set();

            if (isHard) {
                // Dans la zone difficile, injecter en priorité les produits sources de confusions avérées
                CRITICAL_PRODUCTS.forEach(p => {
                    if (p !== product) trapCandidates.add(p);
                });
            }

            // Distracteurs structurels proches (voisins de table ±factorA, ±factorB, inversions ±1, ±2, ±10)
            const offsets = [
                factorA, -factorA, factorB, -factorB,
                factorA * 2, -factorA * 2,
                1, -1, 2, -2, 10, -10
            ];
            for (const offset of offsets) {
                const trap = product + offset;
                if (trap > 0 && trap !== product) trapCandidates.add(trap);
            }

            // Remplissage si besoin avec des produits crédibles
            while (trapCandidates.size < 9) {
                const randomP = (Math.floor(Math.random() * 8) + 2) * (Math.floor(Math.random() * 8) + 2);
                if (randomP !== product) trapCandidates.add(randomP);
            }

            const traps = Array.from(trapCandidates);
            shuffleArray(traps);
            distractors = traps.slice(0, 9);

        } else if (type === 1) {
            // Recherche du premier facteur (? × B = P)
            targetLabelElement.textContent = isHard ? "🔥 TROUVE ?" : "TROUVE ?";
            questionText = `? × ${factorB} = ${product}`;
            answer = factorA;

            const trapCandidates = [];
            for (let n = 1; n <= 12; n++) {
                if (n !== answer) trapCandidates.push(n);
            }
            shuffleArray(trapCandidates);
            distractors = trapCandidates.slice(0, 9);

        } else {
            // Recherche du second facteur (A × ? = P)
            targetLabelElement.textContent = isHard ? "🔥 TROUVE ?" : "TROUVE ?";
            questionText = `${factorA} × ? = ${product}`;
            answer = factorB;

            const trapCandidates = [];
            for (let n = 1; n <= 12; n++) {
                if (n !== answer) trapCandidates.push(n);
            }
            shuffleArray(trapCandidates);
            distractors = trapCandidates.slice(0, 9);
        }

        const boardNumbers = shuffleArray([answer, ...distractors]);
        return { questionText, answer, boardNumbers, isHard };
    }

    function buildBoard(questionText, numbersList) {
        targetNumElement.textContent = questionText;

        // Ajuster dynamiquement la taille selon la longueur de l'opération
        if (questionText.length > 7) {
            targetNumElement.style.fontSize = "1.25rem";
        } else if (questionText.length > 4) {
            targetNumElement.style.fontSize = "1.5rem";
        } else {
            targetNumElement.style.fontSize = "1.75rem";
        }

        // Nettoyage des anciennes cases du plateau
        const existingCases = boardElement.querySelectorAll('.case');
        existingCases.forEach(el => el.remove());

        // Placement circulaire harmonieux des 10 cases
        const total = numbersList.length;
        numbersList.forEach((num, index) => {
            const angle = (index / total) * 2 * Math.PI - Math.PI / 2;
            const radius = 110;
            const x = 145 + radius * Math.cos(angle);
            const y = 145 + radius * Math.sin(angle);

            const caseEl = document.createElement('div');
            caseEl.className = 'case';
            caseEl.style.left = `${x}px`;
            caseEl.style.top = `${y}px`;
            caseEl.onclick = () => handleCaseClick(num);

            const numEl = document.createElement('span');
            numEl.className = 'case-number';
            numEl.textContent = num;
            caseEl.appendChild(numEl);

            boardElement.appendChild(caseEl);
        });
    }

    function nextQuestion() {
        isTransitioning = false;
        const q = generateQuestion();
        targetAnswer = q.answer;

        const feedbackEl = document.getElementById('feedback-box');
        feedbackEl.textContent = q.isHard ? "⚡ Attention calcul piège !" : "Trouve le bon résultat sur le cercle !";
        feedbackEl.style.background = q.isHard ? "#ffeaa7" : "#7bed9f";

        buildBoard(q.questionText, q.boardNumbers);
    }

    function handleCaseClick(clickedNum) {
        if (isTransitioning) return;

        if (clickedNum === targetAnswer) {
            isTransitioning = true;
            playSound('success');
            successCount++;
            questionCounter++;
            timeLeft += TIME_BONUS;
            document.getElementById('feedback-box').textContent = `🎉 Bravo ! +${TIME_BONUS}s !`;
            document.getElementById('feedback-box').style.background = "#2ed573";

            nextQuestionTimeout = setTimeout(nextQuestion, 260);
        } else {
            playSound('fail');
            failCount++;
            timeLeft = Math.max(0, timeLeft - TIME_PENALTY);
            document.getElementById('feedback-box').textContent = `❌ Oups ! -${TIME_PENALTY}s !`;
            document.getElementById('feedback-box').style.background = "#ff3f34";

            if (timeLeft <= 0) {
                endGame();
            }
        }
        updateScoreDisplay();
        updateTimerDisplay();
    }

    function updateScoreDisplay() {
        document.getElementById('score-success').textContent = successCount;
        document.getElementById('score-fail').textContent = failCount;
    }

    function updateTimerDisplay() {
        const fill = document.getElementById('timer-fill');
        const percent = Math.max(0, Math.min(100, (timeLeft / INITIAL_TIME) * 100));

        fill.style.height = percent + '%';

        if (timeLeft <= 10) {
            fill.style.background = '#ff3f34';
        } else if (timeLeft <= 20) {
            fill.style.background = '#ffa502';
        } else {
            fill.style.background = '#2ed573';
        }
    }

    /**
     * Réinitialisation complète et propre de tous les états du jeu
     */
    function resetGameState() {
        // Arrêt des timers et timeouts en vol
        if (timerInterval) {
            clearInterval(timerInterval);
            timerInterval = null;
        }
        if (nextQuestionTimeout) {
            clearTimeout(nextQuestionTimeout);
            nextQuestionTimeout = null;
        }

        // Remise à zéro des compteurs et états de jeu
        isTransitioning = false;
        successCount = 0;
        failCount = 0;
        questionCounter = 0;
        lastTableUsed = null;
        timeLeft = INITIAL_TIME;

        // Régénération complète des pioches de cartes
        easyDeck = refillDeck('easy');
        hardDeck = refillDeck('hard');

        // Réinitialisation de l'affichage
        updateScoreDisplay();
        updateTimerDisplay();
        document.getElementById('feedback-box').textContent = "Trouve le bon résultat sur le cercle !";
        document.getElementById('feedback-box').style.background = "#7bed9f";
    }

    function startGame() {
        initAudio();
        resetGameState();

        document.getElementById('gameover-screen').style.display = 'none';
        document.getElementById('game-screen').style.display = 'flex';

        nextQuestion();

        timerInterval = setInterval(() => {
            timeLeft--;
            updateTimerDisplay();

            if (timeLeft <= 0) {
                endGame();
            }
        }, 1000);
    }

    function restartGame() {
        startGame();
    }

    function endGame() {
        if (timerInterval) {
            clearInterval(timerInterval);
            timerInterval = null;
        }
        if (nextQuestionTimeout) {
            clearTimeout(nextQuestionTimeout);
            nextQuestionTimeout = null;
        }
        isTransitioning = false;

        playSound('fail');
        document.getElementById('game-screen').style.display = 'none';
        document.getElementById('gameover-screen').style.display = 'flex';

        document.getElementById('end-success').textContent = successCount;
        document.getElementById('end-fail').textContent = failCount;

        const totalAttempts = successCount + failCount;
        const precision = totalAttempts > 0 ? Math.round((successCount / totalAttempts) * 100) : 0;
        document.getElementById('end-precision').textContent = precision + '%';
    }

    function toggleMusic() {
        initAudio();
        musicPlaying = !musicPlaying;
        const btn = document.getElementById('music-btn');

        if (musicPlaying) {
            btn.innerText = "🎵 Audio : ON";
            btn.style.background = "#2ed573";
            startAmbientMusic();
        } else {
            btn.innerText = "🎵 Audio : OFF";
            btn.style.background = "#ff9ff3";
            stopAmbientMusic();
        }
    }

    function startAmbientMusic() {
        if (musicInterval) clearInterval(musicInterval);
        musicInterval = setInterval(() => {
            if (!musicPlaying || !audioCtx) return;
            try {
                const now = audioCtx.currentTime;
                const randNote = zenNotes[Math.floor(Math.random() * zenNotes.length)];
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(randNote, now);
                gain.gain.setValueAtTime(0.001, now);
                gain.gain.linearRampToValueAtTime(0.03, now + 0.8);
                gain.gain.exponentialRampToValueAtTime(0.0001, now + 2.2);

                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 2.3);
            } catch(e){}
        }, 2500);
    }

    function stopAmbientMusic() {
        if (musicInterval) {
            clearInterval(musicInterval);
            musicInterval = null;
        }
    }

    function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
    }

    function playSound(type) {
        try {
            if (!audioCtx) initAudio();
            const now = audioCtx.currentTime;

            if (type === 'success') {
                const notes = [523.25, 659.25, 783.99, 1046.50];
                notes.forEach((freq, idx) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, now + (idx * 0.05));
                    gain.gain.setValueAtTime(0.12, now + (idx * 0.05));
                    gain.gain.exponentialRampToValueAtTime(0.01, now + (idx * 0.05) + 0.12);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now + (idx * 0.05));
                    osc.stop(now + (idx * 0.05) + 0.12);
                });
            } else if (type === 'fail') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(250, now);
                osc.frequency.exponentialRampToValueAtTime(80, now + 0.3);
                gain.gain.setValueAtTime(0.12, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.3);
            }
        } catch(e){}
    }

    // Démarrage instantané dès le chargement de la page
    window.addEventListener('DOMContentLoaded', startGame);
</script>
